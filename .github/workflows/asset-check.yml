name: asset-check

# Kontrola rozbitých CSS každých 6 h: na 5 stránkach každého webu overí, či
# referencované stylesheety reálne existujú (200). 404 = rozbité → alert
# css_broken. Ľahké HEAD kontroly, zadarmo. Bolo hodinovo — 6 h stačí (CSS sa
# láme zriedka) a 4× menej behov = 4× menej GitHub-runner šumu.
on:
  schedule:
    - cron: '0 */6 * * *' # každých 6 h (00/06/12/18 UTC)
  workflow_dispatch: {}
  push:
    tags:
      - 'collect-*'

jobs:
  asset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agency/core build
      - name: Run asset-check
        run: node tools/asset-check/index.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
